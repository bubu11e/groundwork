---
steps:
  - name: pre-commit
    # DOCKER_REGISTRY comes from the server's WOODPECKER_ENVIRONMENT: this repo
    # is public, so the internal registry host stays out of it.
    image: ${DOCKER_REGISTRY}/pre-commit:latest
    pull: true
    commands:
      - pre-commit run --all-files

  - name: syntax-check
    image: python:3.12-alpine
    commands:
      - apk add --no-cache git
      - pip install ansible==14.0.0 --quiet
      # workaround: Woodpecker workspaces are world-writable; Ansible refuses to
      # load ansible.cfg from such directories as a security measure, which breaks
      # collections_path. Stripping world-write permission restores normal cfg
      # loading.
      - chmod o-w .
      - ansible-galaxy collection install -r requirements.yml
      - ansible-playbook --syntax-check -i 'localhost,' playbooks/site.yml

when:
  event: [push, manual]
